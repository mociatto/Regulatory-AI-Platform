steps:
  # 1. Build the container image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/regulatory-ai-repo/regulatory-ai-platform:$COMMIT_SHA'
      - '.'
  # 2. Push the container image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/regulatory-ai-repo/regulatory-ai-platform:$COMMIT_SHA'
  # 3. Deploy to Cloud Run, explicitly setting the service account
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'regulatory-ai-platform'
      - '--image'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/regulatory-ai-repo/regulatory-ai-platform:$COMMIT_SHA'
      - '--region'
      - 'us-central1'
      - '--no-allow-unauthenticated'
      - '--service-account=regulatory-ai-runner@regulatory-ai-platform-466513.iam.gserviceaccount.com'
      - '--set-env-vars=GCS_BUCKET_NAME=regulatory-ai-platform-466513-reports,GCP_PROJECT=$PROJECT_ID,GOOGLE_API_KEY=AIzaSyBh6S4wBprDsZahuC-G1gvp89drDEIzm0c'
images:
  - 'us-central1-docker.pkg.dev/$PROJECT_ID/regulatory-ai-repo/regulatory-ai-platform:$COMMIT_SHA'
options:
  logging: CLOUD_LOGGING_ONLY